spring.application.name=torque
server.port=${PORT:8080}
server.compression.enabled=true

# Uploads: one STL (up to 25 MB) plus up to 3 screenshots.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=40MB

# Claude model used for CAD reviews and the simulation lab. Leave ANTHROPIC_API_KEY unset for offline mode.
torque.model=${TORQUE_MODEL:claude-sonnet-5-5}
# AI requests allowed per visitor (IP address) per hour, to protect the API budget.
torque.ai-requests-per-hour=${TORQUE_AI_PER_HOUR:40}
server.forward-headers-strategy=framework
