<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img"
 aria-label="A lever balanced on a fulcrum: twenty newtons at 1.4 metres on the left equals eighty newtons at 0.35 metres on the right, both 28 newton metres">
<style>
 text{font-family:Inter,Helvetica,Arial,sans-serif;fill:#2b2d42}
 .lbl{font-size:13px}.val{font-size:13.5px;font-weight:600}.hdr{font-size:12px;fill:#777c99;letter-spacing:.08em}
 .part{fill:#e4e6ee;stroke:#737892;stroke-width:1.2}
 .dim{stroke:#1f4fd8;stroke-width:1.1}
 .frc{stroke:#d1560f;stroke-width:1.8}
 .ctr{stroke:#9aa0bb;stroke-width:.9;stroke-dasharray:9 3 2 3}
</style>
<defs>
 <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#d1560f"/></marker>
 <marker id="t" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M3.5 0v7" stroke="#1f4fd8" stroke-width="1.4"/></marker>
</defs>
<text x="24" y="28" class="hdr">STATIC EQUILIBRIUM:  Στ = 0</text>

<rect x="70" y="140" width="520" height="13" rx="4" class="part"/>
<path d="M430 155 L408 205 L452 205 z" class="part"/>
<line x1="430" y1="118" x2="430" y2="225" class="ctr"/>
<text x="430" y="223" class="lbl" fill="#777c99" text-anchor="middle">fulcrum</text>

<line x1="120" y1="140" x2="120" y2="78" class="frc" marker-end="url(#a)"/>
<text x="120" y="68" class="val" fill="#d1560f" text-anchor="middle">20 N</text>
<line x1="120" y1="172" x2="430" y2="172" class="dim" marker-start="url(#t)" marker-end="url(#t)"/>
<text x="275" y="189" class="lbl" fill="#1f4fd8" text-anchor="middle">r₁ = 1.40 m</text>

<line x1="548" y1="140" x2="548" y2="78" class="frc" marker-end="url(#a)"/>
<text x="548" y="68" class="val" fill="#d1560f" text-anchor="middle">80 N</text>
<line x1="430" y1="172" x2="548" y2="172" class="dim" marker-start="url(#t)" marker-end="url(#t)"/>
<text x="489" y="189" class="lbl" fill="#1f4fd8" text-anchor="middle">r₂ = 0.35 m</text>

<text x="330" y="256" class="val" text-anchor="middle">20 × 1.40 = 28 N·m        80 × 0.35 = 28 N·m</text>
<text x="330" y="278" class="lbl" fill="#777c99" text-anchor="middle">equal and opposite, so the beam does not turn</text>
</svg>
