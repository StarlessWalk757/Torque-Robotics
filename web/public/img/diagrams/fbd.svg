<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img"
 aria-label="A bracket bolted to a wall holding a load, redrawn beside it as a free body diagram with arrows for weight, load and the two bolt reactions">
<style>
 text{font-family:Inter,Helvetica,Arial,sans-serif;fill:#2b2d42}
 .lbl{font-size:12.5px}.val{font-size:13px;font-weight:600}.hdr{font-size:12px;fill:#777c99;letter-spacing:.08em}
 .part{fill:#e4e6ee;stroke:#737892;stroke-width:1.2}
 .wall{fill:#d3d6e2;stroke:#737892;stroke-width:1.2}
 .frc{stroke:#d1560f;stroke-width:1.9}
 .rea{stroke:#1f4fd8;stroke-width:1.9}
 .thin{stroke:#9aa0bb;stroke-width:1;stroke-dasharray:5 4}
</style>
<defs>
 <marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#d1560f"/></marker>
 <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#1f4fd8"/></marker>
</defs>
<text x="24" y="26" class="hdr">THE REAL PART</text>
<text x="368" y="26" class="hdr">ITS FREE-BODY DIAGRAM</text>

<!-- real part -->
<rect x="40" y="52" width="26" height="200" class="wall"/>
<rect x="66" y="96" width="160" height="22" class="part"/>
<circle cx="86" cy="107" r="5" fill="#737892"/><circle cx="86" cy="107" r="5" fill="#737892"/>
<rect x="196" y="118" width="38" height="34" rx="3" class="part"/>
<text x="215" y="172" class="lbl" text-anchor="middle">load</text>
<text x="146" y="86" class="lbl" text-anchor="middle">bracket</text>
<text x="53" y="272" class="lbl" text-anchor="middle">wall</text>

<line x1="300" y1="150" x2="340" y2="150" class="thin"/>

<!-- free body -->
<rect x="398" y="96" width="160" height="22" class="part"/>
<circle cx="418" cy="107" r="4" fill="none" stroke="#737892"/>
<!-- load down at the end -->
<line x1="548" y1="118" x2="548" y2="186" class="frc" marker-end="url(#o)"/>
<text x="560" y="160" class="val" fill="#d1560f">F</text>
<!-- weight at centre of mass -->
<line x1="478" y1="118" x2="478" y2="168" class="frc" marker-end="url(#o)"/>
<text x="488" y="150" class="val" fill="#d1560f">W</text>
<text x="478" y="92" class="lbl" fill="#777c99" text-anchor="middle">centre of mass</text>
<!-- bolt reactions -->
<line x1="418" y1="107" x2="418" y2="46" class="rea" marker-end="url(#b)"/>
<text x="404" y="42" class="val" fill="#1f4fd8" text-anchor="end">R↑</text>
<line x1="418" y1="107" x2="358" y2="107" class="rea" marker-end="url(#b)"/>
<text x="352" y="103" class="val" fill="#1f4fd8" text-anchor="end">H</text>

<text x="24" y="300" class="lbl" fill="#777c99">Draw the part alone. Replace everything you removed with an arrow. Nothing else goes on it.</text>
</svg>
