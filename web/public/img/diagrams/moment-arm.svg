<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img"
 aria-label="A wrench with a force applied at an angle theta, showing the moment arm is r sine theta, the perpendicular distance from the pivot to the line of action">
<style>
 text{font-family:Inter,Helvetica,Arial,sans-serif;fill:#2b2d42}
 .lbl{font-size:13px}.val{font-size:13.5px;font-weight:600}.hdr{font-size:12px;fill:#777c99;letter-spacing:.08em}
 .part{fill:#e4e6ee;stroke:#737892;stroke-width:1.2}
 .dim{stroke:#1f4fd8;stroke-width:1.3}
 .frc{stroke:#d1560f;stroke-width:1.8}
 .thin{stroke:#9aa0bb;stroke-width:1;stroke-dasharray:5 4}
</style>
<defs>
 <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#d1560f"/></marker>
 <marker id="t" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M3.5 0v7" stroke="#1f4fd8" stroke-width="1.4"/></marker>
</defs>
<text x="24" y="28" class="hdr">ONLY THE PERPENDICULAR DISTANCE COUNTS</text>

<circle cx="110" cy="215" r="20" class="part"/><circle cx="110" cy="215" r="7" fill="#737892"/>
<text x="110" y="262" class="lbl" fill="#777c99" text-anchor="middle">pivot</text>
<rect x="106" y="205" width="300" height="19" rx="4" class="part"/>

<!-- line of action, extended both ways -->
<line x1="286" y1="291" x2="520" y2="116" class="thin"/>
<line x1="406" y1="215" x2="500" y2="144" class="frc" marker-end="url(#a)"/>
<text x="508" y="138" class="val" fill="#d1560f">F</text>
<path d="M356 215 A 50 50 0 0 0 344 184" class="thin"/>
<text x="366" y="203" class="lbl">θ</text>

<!-- r along the handle -->
<line x1="110" y1="245" x2="406" y2="245" class="dim" marker-start="url(#t)" marker-end="url(#t)"/>
<text x="258" y="262" class="lbl" fill="#1f4fd8" text-anchor="middle">r</text>

<!-- perpendicular from pivot to the line of action -->
<line x1="110" y1="215" x2="212" y2="79" class="dim" marker-start="url(#t)" marker-end="url(#t)"/>
<rect x="196" y="76" width="11" height="11" fill="none" stroke="#1f4fd8" stroke-width="1"/>
<text x="120" y="120" class="val" fill="#1f4fd8">d = r sin θ</text>
<text x="120" y="138" class="lbl" fill="#777c99">moment arm</text>

<text x="24" y="306" class="lbl" fill="#777c99">τ = F · d = F r sin θ    —    pull along the handle (θ = 0) and d = 0, so τ = 0</text>
</svg>
