<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Torque teaches robotics from the ground up: the mechanics, electronics and CAD that go into building a robot, through lessons, hands-on builds and graded CAD projects." />
    <meta name="theme-color" content="#0d4f5c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1216" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Torque · Learn Robotics by Building</title>
  </head>
  <body>
    <script>
      // Set the theme before first paint so there's no flash of the wrong colors.
      try {
        var t = localStorage.getItem("torque.theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
